# ============================================================================
# MediaMTX config — one entry per farm camera
# ----------------------------------------------------------------------------
# `cameras.stream_key` in the database must match a `paths:` key here.
# Cameras publish RTSP into MediaMTX; the app never sees those credentials.
# ============================================================================

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ---- RTSP ingest -----------------------------------------------------------
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspEncryption: "no"

# ---- RTMP ingest (a DVR/camera that can PUSH but cannot be reached) ------
# Many Dahua/Hikvision recorders can push RTMP out of the box; that removes the
# need for a port forward or a public IP at the farm at all.
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# ---- HLS playback (what the browser consumes via the app proxy) -----------
# Booleans must be YAML `true`/`false` — `yes`/`no` are rejected by recent builds.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
# hlsAlwaysRemoveSegments was removed upstream; see hlsMuxerCloseAfter below.
hlsAllowOrigins: ["*"]
hlsDirectory: /tmp/hls
hlsMuxerCloseAfter: 60s

# ---- WebRTC playback (low latency, via go2rtc in front) ------------------
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcAdditionalHosts: []

# ---- SRT ingest -----------------------------------------------------------
srt: yes
srtAddress: :8890

# ---- Authentication: publish AND read both need a password ----------------
#
# Before: `publishUser/publishPass` guarded publishing only. Reading — RTSP
# :8554, HLS :8888, WebRTC :8889 — was wide open, so anyone who could reach a
# port saw every camera. `expose:` was treated as protection, but
# docker-compose.mediamtx.yml runs with `network_mode: host`, where "not
# published" means "reachable on the host's network".
#
# Now two users, and neither password lives in this file:
#
#   publisher  → publish + read   (the DVR pushing RTMP, go2rtc pulling RTSP)
#   reader     → read + playback  (Caddy's server-side hop to MediaMTX)
#
# They are supplied per index through the environment, which MediaMTX maps
# onto list entries (MTX_AUTHINTERNALUSERS_<i>_<FIELD>):
#
#   MTX_AUTHINTERNALUSERS_0_USER=publisher
#   MTX_AUTHINTERNALUSERS_0_PASS=<secret>
#   MTX_AUTHINTERNALUSERS_1_USER=reader
#   MTX_AUTHINTERNALUSERS_1_PASS=<secret>
#
# Both compose files set all four from .env with `${VAR:?...}`, so a missing
# password stops the stack instead of opening the cameras. Deliberately not
# written here: this file is in git, and `CHANGE_ME_PUBLISH_PASSWORD` was a
# WORKING password — worse than none, because it looks secure.
#
# If a URL ever needs credentials inline, MediaMTX also accepts
# ?user=…&pass=… — but the app never does that; credentials in URLs leak into
# access logs.
authMethod: internal

paths:
  # ════════════════════════════════════════════════════════════════════════
  # ⭐ CGNAT-এর আসল সমাধান — DVR/camera নিজেই এখানে PUSH করে
  # ════════════════════════════════════════════════════════════════════════
  # নিচের entry-তে `source: publisher` মানে MediaMTX কারও পেছনে ছুটবে না —
  # বাইরে থেকে কেউ ঢুকে ছবি ঢালবে। CGNAT শুধু "বাইরে থেকে ভেতরে ঢোকা" আটকায়;
  # "ভেতর থেকে বাইরে যাওয়া" কখনো আটকায় না। তাই ভিপিএস থেকে ক্যামেরা পর্যন্ত
  # কোনো পথ লাগে না, আর পাবলিক IP-ও দরকার নেই।
  #
  #   DVR ──RTMP push──► rtmp://<VPS-IP>:1935/dvr-cam-01  ──►  দর্শক (HLS)
  #
  # চালানোর আগে:
  #   1. docker-compose.stream-vps.yml-এ "1935:1935" পোর্টটা পাবলিশ করা আছে
  #      কি না দেখুন, আর DigitalOcean-এর Firewall-এ TCP 1935 খুলুন।
  #   2. পাসওয়ার্ড আসে .env-এর MEDIAMTX_PUBLISH_PASS থেকে
  #      (docker-compose.stream-vps.yml → MTX_AUTHINTERNALUSERS_0_PASS),
  #      এই ফাইলে পাসওয়ার্ড লেখা হয় না। DVR-এর RTMP সেটিংয়ে
  #      ইউজার `publisher` আর ঠিক সেই পাসওয়ার্ড দিন।
  #   3. DVR-এ: Setup → Network → Platform Access/Port → RTMP
  #        Custom Address = rtmp://<VPS-IP>:1935/dvr-cam-01
  #      (কিছু ফার্মওয়্যার address আর stream key আলাদা করে চায়: তখন
  #       address = rtmp://<VPS-IP>:1935/dvr-cam  আর key = 01)
  #
  # তারপর ক্যামেরা যোগ করার সময় stream_key = ঠিক "dvr-cam-01" দিন।
  # ⚠️ DVR-এ RTMP না থাকলে এই entry অকেজো — তখন ফোন/Pi দিয়ে push করতে হবে।
  dvr-cam-01:
    source: publisher
    # A pusher is always "on" from MediaMTX's point of view; nothing to pull.
    sourceOnDemand: false

  # ════════════════════════════════════════════════════════════════════════
  # নিচেরগুলো VPS-এর দিক থেকে ক্যামেরা টানে (rtsp://…)
  # এগুলো তখনই কাজ করবে যখন ISP সত্যিই পাবলিক IP দিয়েছে + port forward আছে।
  # CGNAT-এ এরা চিরকাল "ক্যামেরা অফলাইন" দেখাবে — ওটাই স্বাভাবিক।
  # ════════════════════════════════════════════════════════════════════════

  # --- Savar Greens (vegetables) ---
  savar-greens-field-01:
    source: rtsp://admin:CAM_PASSWORD@192.168.10.11:554/Streaming/Channels/101
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 30s

