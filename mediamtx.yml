# ============================================================================
# MediaMTX config — one entry per farm camera
# ----------------------------------------------------------------------------
# `cameras.stream_key` in the database must match a `paths:` key here.
# Cameras publish RTSP into MediaMTX; the app never sees those credentials.
# ============================================================================

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ---- RTSP ingest -----------------------------------------------------------
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspEncryption: "no"

# ---- RTMP ingest (a DVR/camera that can PUSH but cannot be reached) ------
# Many Dahua/Hikvision recorders can push RTMP out of the box; that removes the
# need for a port forward or a public IP at the farm at all.
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# ---- HLS playback (what the browser consumes via the app proxy) -----------
# Booleans must be YAML `true`/`false` — `yes`/`no` are rejected by recent builds.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
# hlsAlwaysRemoveSegments was removed upstream; see hlsMuxerCloseAfter below.
hlsAllowOrigins: ["*"]
hlsDirectory: /tmp/hls
hlsMuxerCloseAfter: 60s

# ---- WebRTC playback (low latency, via go2rtc in front) ------------------
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcAdditionalHosts: []

# ---- SRT ingest -----------------------------------------------------------
srt: yes
srtAddress: :8890

# ---- No on-disk recording (privacy + disk) -------------------------------
pathDefaults:
  # Reject publishers that don't use the shared secret below.
  publishUser: publisher
  publishPass: CHANGE_ME_PUBLISH_PASSWORD
  publishIPs: []
  record: false

paths:
