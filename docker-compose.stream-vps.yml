# ============================================================================
#  docker-compose.stream-vps.yml — the live-CCTV stack on its own small VPS
# ----------------------------------------------------------------------------
#  WHY THIS IS SEPARATE FROM VERCEL
#  Vercel runs serverless functions: they cannot hold a socket open, cannot keep
#  an RTSP connection alive, and have a read-only filesystem. MediaMTX/go2rtc
#  need all three, so the stream edge lives on a $4–6/month VPS (or a Raspberry
#  Pi at the farm) and Vercel only ever hands out a signed, 5-minute URL.
#
#  Two ways to expose it. Pick ONE.
#
#  ── OPTION B: public HTTPS with a real certificate  ✅ RECOMMENDED ────────
#    1. Point an A record (stream.example.com) at the VPS IP.
#    2. Open 80 and 443 only.
#    3. Run:  docker compose -f docker-compose.stream-vps.yml --profile public up -d
#    Caddy fetches and renews the Let's Encrypt certificate itself.
#
#  ── OPTION A: Cloudflare Tunnel (no open ports) ───────────────────────────
#    Works, but do NOT use it for a commercial video stream on the Free plan:
#    Cloudflare's Service-Specific Terms (CDN section) restrict continuous
#    video / large-file delivery over the free CDN, and a public tunnel
#    hostname counts as CDN traffic. Enforcement is throttling / a notice page,
#    not an instant ban — but it is the wrong foundation for paid viewing.
#    Fine if you are on a paid Cloudflare plan, or if the hostname only serves
#    pages and the token API.
#    1. Add your domain to Cloudflare.
#    2. Zero Trust → Networks → Tunnels → Create; copy the token to .env as
#       CF_TUNNEL_TOKEN.
#    3. Public Hostname:  stream.example.com  →  http://caddy-proxy:8080
#    4. Run:  docker compose -f docker-compose.stream-vps.yml --profile tunnel up -d
#
#  THEN, in Vercel → Settings → Environment Variables:
#        STREAM_PROXY_TARGET = https://stream.example.com
#        GO2RTC_WHEP_URL     = https://stream.example.com/webrtc
#        STREAM_PROXY_SECRET = <same long random string as below>
#        STREAM_PUBLIC_BASE  = https://stream.example.com   ← video bypasses Vercel
#
#  WHY STREAM_PUBLIC_BASE MATTERS: without it every video byte is billed as
#  Vercel Fast Data Transfer (Pro: 1 TB included, then ~$0.15/GB). Ten
#  all-day viewers ≈ 1.5 TB ≈ $73/month of pure camera traffic. With it the
#  player is handed https://stream.example.com/hls/<key>/index.m3u8?t=<token>,
#  so the bytes flow VPS → browser and Vercel only serves pages and the token.
#  middleware.ts adds that origin to connect-src and media-src automatically
#  from the same env var, so no CSP edit is needed.
#
#  VERIFY
#    curl -s -o /dev/null -w '%{http_code}\n' "https://stream.example.com/live-$STREAM_EDGE_SECRET/hls/test/index.m3u8"
#    → 401  (no ?t= token: Caddy refused before touching MediaMTX)
#    → 404 for any path outside /live-<secret>/  (the prefix is the outer lock)
# ============================================================================

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ba-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_PROTOCOLS: tcp
      MTX_HLS: "yes"
      MTX_HLS_VARIANT: lowLatency
      MTX_HLS_SEGMENTDURATION: 1s
      MTX_HLS_SEGMENTCOUNT: 7
      # MTX_HLS_ALWAYSREMOVESEGMENTS was removed upstream (now hlsMuxerCloseAfter)
      MTX_HLS_MUXERCLOSEAFTER: 60s
      MTX_HLS_ALWAYSREMOVESEGMENTS: "yes"   # kept for older images; ignored by new ones
      # HLS is consumed through the Caddy proxy, never straight from a browser,
      # so the origin itself does not need a wide CORS policy.
      MTX_HLS_ALLOWORIGINS: "['https://biswas-agro.vercel.app','https://bishwasagro.com']"
      MTX_RTSPTRANSPORTS: tcp
      MTX_AUTHINTERNALUSERS: "yes"
      MTX_HLSDIRECTORY: /tmp/hls
      MTX_LOGLEVEL: info
    expose:
      - "8888"
      - "8889"
      - "8554"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # NOTE: no network_mode: host — with host networking none of the `expose`
    # ports exist on the compose bridge and `reverse_proxy mediamtx:8888`
    # cannot resolve. Cameras are reached by the source URLs you put in
    # mediamtx.yml (a public IP or a LAN address), which works fine from the
    # bridge. If a camera is only reachable from the VPS's own loopback, use
    # `extra_hosts` instead of host networking.

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: ba-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    # Not published to the host: the app reaches go2rtc through the Vercel
    # proxy / Caddy, so a public :1984 would just be an unauthenticated API
    # (go2rtc's own API has no auth). WebRTC media needs a public UDP port,
    # so 8555/udp stays open — that one carries media, not control.
    expose:
      - "1984"
    ports:
      - "8555:8555/udp"
      - "8555:8555/tcp"

  # ── the HTTPS edge (direct-video mode) ───────────────────────────────────
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    container_name: ba-caddy
    restart: unless-stopped
    environment:
      STREAM_PUBLIC_HOST: ${STREAM_PUBLIC_HOST:?set STREAM_PUBLIC_HOST in .env}
      STREAM_EDGE_SECRET: ${STREAM_EDGE_SECRET:?set STREAM_EDGE_SECRET in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mediamtx

  # ── proxy-mode edge (only when STREAM_PUBLIC_BASE is unset) ─────────────
  caddy-proxy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: ba-caddy-proxy
    restart: unless-stopped
    environment:
      STREAM_PROXY_SECRET: ${STREAM_PROXY_SECRET:?set STREAM_PROXY_SECRET in .env}
    volumes:
      - ./Caddyfile.proxy:/etc/caddy/Caddyfile:ro
    expose:
      - "8080"
    depends_on:
      - mediamtx

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: ba-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN in .env}
    depends_on:
      - caddy-proxy

volumes:
  caddy_data:
  caddy_config:
